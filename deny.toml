[graph]
all-features = true

[advisories]
ignore = [
    # paste is unmaintained; transitive via pyo3 0.24 macro internals.
    # Remove when the pyo3 >= 0.29 upgrade (dependabot PR #174) lands.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/KooshaPari/clap-ext",
]
