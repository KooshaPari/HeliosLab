[build-system]
requires = ["maturin>=1.9.2,<2.0"]
build-backend = "maturin"

[project]
name = "phenotype-config"
version = "0.14.11.dev3"
description = "Python bindings for phenotype-config SDK"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"

[tool.maturin]
features = ["pyo3/extension-module"]
