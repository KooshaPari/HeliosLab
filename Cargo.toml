[workspace]
resolver = "2"
members = ["pheno-core", "pheno-db", "pheno-crypto", "pheno-cli", "crates/pheno-ffi-python", "crates/pheno-ffi-go"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.14.11-canary.3"
edition = "2021"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap-ext = { git = "https://github.com/KooshaPari/clap-ext", tag = "v0.1.0" }
# Use pheno-otel from PhenoObservability v0.1.0 (ADR-037 substrate).
# Git + tag + subdirectory form pins the crate to a known-good release
# so all consumers across the pheno-* fleet see the same OTLP wire-format
# export surface. See https://github.com/KooshaPari/PhenoObservability/releases/tag/v0.1.0
pheno-otel = { git = "https://github.com/KooshaPari/PhenoObservability", tag = "v0.1.0", subdirectory = "pheno-otel" }

# --- Phenotype shared infrakit crates (from PhenoInfra) ---
phenotype-crypto = { git = "https://github.com/KooshaPari/PhenoInfra.git", rev = "dd040ed1" }
phenotype-health = { git = "https://github.com/KooshaPari/PhenoInfra.git", rev = "dd040ed1" }
phenotype-observability = { git = "https://github.com/KooshaPari/PhenoInfra.git", rev = "dd040ed1" }
phenotype-state-machine = { git = "https://github.com/KooshaPari/PhenoInfra.git", rev = "dd040ed1" }
