name: phenoctl-concurrency-stress

on:
  push:
    branches: [main]
    paths:
      - 'pheno-cli/**'
      - 'demos/phenoctl-concurrency-stress/**'
  workflow_dispatch:

jobs:
  demo:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Build phenoctl
        run: cargo build -p pheno-cli
      - name: Run stress driver (15s, N=8)
        run: |
          cd demos/phenoctl-concurrency-stress
          N=8 duration_s=15 bash scripts/stress.sh
          python3 scripts/aggregate.py > artifacts/metrics.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phenoctl-concurrency-stress
          path: demos/phenoctl-concurrency-stress/artifacts/
          if-no-files-found: warn
