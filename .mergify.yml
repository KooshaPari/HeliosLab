# Mergify Configuration — Optimized for multi-language monorepos
# Docs: https://docs.mergify.com/

pull_request_rules:
  # Auto-merge when all CI checks pass and PR is approved
  - name: Auto-merge when approved + CI green
    conditions:
      - "#review-requested=0"
      - "#approved-reviews-by>=1"
      - check-success=coverage-check
      - check-success=lint-check
      - check-success=unit-check
      - -conflict
      - -closed
    actions:
      merge:
        method: squash
        commit_message_format:
          title: pr-title

  # Auto-merge owner PRs when CI passes (no self-review required)
  - name: Auto-merge owner PRs + CI green
    conditions:
      - author=KooshaPari
      - check-success=coverage-check
      - check-success=lint-check
      - check-success=format-check
      - check-success=unit-check
      - check-success=Type Check + Lint + Tests
      - check-success=Mergify Merge Protections
      - -conflict
      - -closed
      - -draft
    actions:
      merge:
        method: squash
        commit_message_format:
          title: pr-title

  # Auto-merge dependabot/Renovate PRs when CI passes
  - name: Auto-merge dependency updates
    conditions:
      - or:
          - author=dependabot[bot]
          - author=renovate[bot]
      - check-success=coverage-check
      - check-success=lint-check
      - -conflict
      - -closed
    actions:
      merge:
        method: squash
        commit_message_format:
          title: pr-title

  # Auto-merge bot PRs (CI configs, formatting) when CI passes
  - name: Auto-merge bot housekeeping PRs
    conditions:
      - or:
          - author=trunk-io[bot]
          - author=mergify[bot]
          - author=github-actions[bot]
      - check-success=lint-check
      - check-success=format-check
      - -conflict
      - -closed
    actions:
      merge:
        method: squash

  # Label PRs based on changed files
  - name: Label Python changes
    conditions:
      - files~=\.py$
    actions:
      label:
        add:
          - python

  - name: Label Rust changes
    conditions:
      - files~=\.rs$|Cargo\.
    actions:
      label:
        add:
          - rust

  - name: Label Go changes
    conditions:
      - files~=\.go$|go\.
    actions:
      label:
        add:
          - go

  - name: Label TypeScript changes
    conditions:
      - files~=\.ts$|\.tsx$|package\.json
    actions:
      label:
        add:
          - typescript

  # Close stale PRs after 30 days
  - name: Close stale PRs
    conditions:
      - -closed
      - -draft
      - updated-at < 30 days ago
      - "#review-requested=0"
    actions:
      comment:
        message: >
          This PR has been automatically closed after 30 days of inactivity.
          Feel free to reopen if still relevant.
      close: {}

  # Warn on large PRs
  - name: Warn on large PRs
    conditions:
      - -closed
      - -draft
      - "#files>20"
    actions:
      comment:
        message: >
          **Large PR Alert**: This PR touches {{ number }} files.
          Consider splitting into smaller PRs for easier review.

  # Add ready-to-merge label when all checks pass
  - name: Add ready-to-merge label
    conditions:
      - -closed
      - -draft
      - check-success=coverage-check
      - check-success=lint-check
      - check-success=unit-check
      - "#approved-reviews-by>=1"
    actions:
      label:
        add:
          - ready-to-merge
