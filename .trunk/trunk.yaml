version: 0.1

plugins:
  sources:
    # Trunk now requires `uri` on plugin sources. Without it the launcher reports
    # "plugin must set `uri` and `ref` but `uri` was not set" as a high-severity
    # trunk/config-error, and the Trunk Check job fails before linting anything.
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.2.2
    - id: community
      ref: main

cli:
  version: 1.22.12
