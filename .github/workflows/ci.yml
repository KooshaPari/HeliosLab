name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript-quality:
    name: typescript-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:coverage

  rust-quality:
    name: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude pheno-ffi-python --all-targets -- -D warnings
      - run: cargo test --workspace --exclude pheno-ffi-python

  traceability:
    name: traceability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun run traceability

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@6261f5cd38e133cdcf00c23e3943f3e9d012d538
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  ci-summary:
    name: ci-summary
    runs-on: ubuntu-24.04
    needs: [typescript-quality, rust-quality, traceability, secret-scan]
    if: always()
    steps:
      - name: Assert every required job succeeded
        env:
          TYPESCRIPT: ${{ needs.typescript-quality.result }}
          RUST: ${{ needs.rust-quality.result }}
          TRACEABILITY: ${{ needs.traceability.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          test "${TYPESCRIPT}" = success
          test "${RUST}" = success
          test "${TRACEABILITY}" = success
          test "${SECRET_SCAN}" = success
