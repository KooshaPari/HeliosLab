name: Security Guard (Hooks)
'on':
  workflow_dispatch: null
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  push:
    branches:
    - '**'
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      - name: Wire Git hook path and verify guard hook
        run: |
          git config core.hooksPath .github/hooks
          test -f .github/hooks/pre-commit
          test -x .github/hooks/pre-commit
          test -f .github/hooks/security-guard.sh
          test -x .github/hooks/security-guard.sh

      - name: Run security guard hook
        env:
          # Same reason as security-guard.yml: HEAD is main on `push: main`, so
          # no-commit-to-branch fails every run.
          #
          # This is a developer-workflow guard, not a content check, so nothing
          # security-relevant is skipped by excluding it. That is separate from
          # the fact that this workflow currently runs no content hooks at all:
          # `pre-commit run` with no file arguments reads the STAGED index, which
          # actions/checkout leaves empty, so every other hook reports
          # "(no files to check)". See the note in security-guard.yml.
          SKIP: no-commit-to-branch
        run: |
          .github/hooks/pre-commit
