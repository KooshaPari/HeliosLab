name: Alert sync issues (disabled)

# Alert synchronization previously depended on a reusable workflow in the
# deleted KooshaPari/phenoShared repository. Keep a manual, non-mutating notice
# until a supported local implementation is reviewed and restored.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unavailable:
    name: Alert sync unavailable (manual notice only)
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Report disabled integration
        run: |
          echo "::notice title=Alert sync disabled::The phenoShared reusable workflow no longer exists."
          echo "No alerts were read and no issues were created, updated, or closed."
