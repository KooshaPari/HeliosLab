name: cargo-deny
on:
  workflow_dispatch:
  pull_request:
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/deny.yml']
  push:
    branches: [main]
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/deny.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny-workspace:
    name: cargo deny check --workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-deny@0.19.0

      - name: Run cargo-deny against the workspace
        run: |
          cargo generate-lockfile
          cargo deny --workspace --all-features check
