name: Monthly SBOM Refresh

# The reusable workflow lives in KooshaPari/PhenoShared. It was previously
# referenced as KooshaPari/phenotype-tooling, which does not exist under any
# name, so this workflow failed at startup without a job ever starting. The
# org was redacted during a PII sweep; the real org is KooshaPari.

on:
  schedule:
    - cron: "0 0 1 * *" # 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    # Pinned to PhenoShared main as of 2026-09-18.
    uses: KooshaPari/PhenoShared/.github/workflows/sbom-monthly.yml@c035018315e38ffd3a8a893a32e559863fbee98b
    with:
      repo_path: '.'
      build_system: 'node'
    permissions:
      contents: read
