name: PR Governance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - docs/reference/constitution.md
  repository_dispatch:
    types: [constitution-review-reevaluation]

permissions:
  contents: read

jobs:
  constitution-open-pr-inventory:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch governance re-evaluation for every open PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const reevaluate = require("./.github/scripts/reevaluate-open-prs.cjs");
            const count = await reevaluate({ github, context });
            core.info(`Dispatched governance re-evaluation for ${count} open pull request(s).`);

  pr-governance-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Bind governance evaluation to the current PR head
        id: target
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const dispatched = context.eventName === "repository_dispatch";
            const prNumber = dispatched
              ? Number(context.payload.client_payload?.pr_number)
              : context.payload.pull_request?.number;
            const requestedHead = dispatched
              ? context.payload.client_payload?.head_sha
              : context.payload.pull_request?.head?.sha;
            if (!Number.isInteger(prNumber) || typeof requestedHead !== "string") {
              throw new Error("Governance evaluation requires an explicit PR number and head SHA");
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            if (pull.state !== "open" || pull.head.sha !== requestedHead) {
              throw new Error(`PR #${prNumber} is closed or its head changed before re-evaluation`);
            }
            core.setOutput("pr_number", String(prNumber));
            core.setOutput("head_sha", requestedHead);
      - name: Canonical Governance Check
        run: echo "Governance check entered for PR #${{ steps.target.outputs.pr_number }} at ${{ steps.target.outputs.head_sha }}"
