# reusable-a11y.yml
# Reusable WCAG 2.1 AA gate — boots the app dev server and runs axe Playwright specs.

name: reusable-a11y

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_dir:
        required: true
        type: string
      dev_command:
        required: true
        type: string
      dev_port:
        required: true
        type: number
      spec_glob:
        required: true
        type: string

permissions:
  contents: read

jobs:
  axe:
    name: axe-${{ inputs.app_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run axe accessibility gate
        # Playwright resolves playwright.config.ts before playwright.config.mts,
        # and this repo has BOTH at the root. The .ts config boots apps/desktop on
        # its own ports with testDir "."; this gate expects the fixture server on
        # the declared dev_port with testDir "./e2e", which is what .mts provides.
        # Naming the config explicitly removes the shadowing.
        env:
          # dev_port was declared as an input at the top of this file but never
          # referenced, so the value both callers pass (5173) was silently ignored
          # and .mts fell back to its own default.
          HELIOSLAB_RENDERER_PORT: ${{ inputs.dev_port }}
        run: bunx playwright test --config playwright.config.mts ${{ inputs.spec_glob }}
        working-directory: ${{ inputs.app_dir }}
