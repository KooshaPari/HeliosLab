name: Journey Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey-gate:
    name: Verify committed journey evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: stdout
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.97.1

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@874b06e0d3f63371f9ddbee43d4c8ebc73021583
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.29
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          tesseract --version

      - name: Verify journey evidence
        # The external `phenotype-journey` verifier was installed from
        # KooshaPari/phenotype-journeys, which does not exist, so the install
        # step could never succeed and this gate failed on every run. The
        # committed evidence is instead verified by
        # tests/test_journey_evidence.py, which reads the manifests, tapes and
        # keyframes directly with json/yaml and needs no external binary.
        run: |
          uv run --locked --extra dev pytest tests/test_journey_evidence.py -q
