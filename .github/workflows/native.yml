name: native

# Runs the checks that cannot be executed on the Windows development machine.
# Locally, Go's cgo link step has no C compiler and Zig/Rust/Mojo are absent, so
# this workflow is the mechanism that actually verifies the native packages.
#
# It runs on macOS because that is the shipping target (Electrobun is
# macOS-first) and because the cgo build genuinely needs a real toolchain.

on:
  # This job runs three tools from tools/, so a change to any of them has to
  # re-run it. Listing only the native build script meant that editing the
  # checks themselves did not trigger the workflow that runs them.
  push:
    paths:
      - "packages/**"
      - "tools/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "packages/**"
      - "tools/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

jobs:
  # Portable logic. Runs fast on Linux, no C toolchain required.
  core-logic:
    name: portable logic (go + zig core + bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Orchestrator tests
        working-directory: packages/orchestrator
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Device manager tests
        working-directory: packages/device-manager
        run: |
          go vet ./...
          go test -count=1 ./...

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig portable core tests
        working-directory: packages/pty-pool
        run: zig build test

      - uses: oven-sh/setup-bun@v2

      # Static check that every symbol the bridge calls is exported by the
      # matching native source. Needs no toolchain, so it runs before any build
      # and catches drift in the hand-maintained symbol tables.
      - name: FFI symbol contract
        run: bun tools/check-abi.ts

      # The contract check reports only what its parsers return, so a parser
      # that matches nothing reports a contract that holds. These pin the two
      # shapes that broke exactly that way: the nested `args`/`returns` pairs,
      # and the `pub` on every Zig export.
      - name: FFI symbol contract parser tests
        run: bun test tests/unit/abi-parsers.test.ts

      # Nothing else verifies the renderer bundles: the unit tests import
      # modules directly, and the real app build needs macOS and Electrobun. So
      # a broken import path - and the terminal store imports across package
      # boundaries with a deep relative path - would surface only when somebody
      # launched the app.
      - name: Renderer bundle check
        run: bun tools/check-renderer-bundle.ts

      # Bun's test runner executes the bridge but does not typecheck it. The
      # CString misuse fixed on 2026-09-17 was invisible to the test suite
      # because no native library is loaded during it, and would have thrown at
      # runtime on every string-returning call.
      #
      # The repo baseline has ~1000 pre-existing typecheck errors, so this runs
      # the project's own typecheck and fails only on errors inside the paths
      # this work owns. Verified to exit 1 on a planted error.
      - name: Typecheck the native integration surface
        run: bun tools/typecheck-owned.ts

      - name: FFI bridge contract tests
        run: bun test packages/runtime-core/tests/unit/ffi_bridge.test.ts

  # Changes the wiring the app actually loads: Zig library, Rust cdylib, and the
  # Go cgo shared libraries. Needs a C toolchain and the real target OS.
  native-link:
    name: native link (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the Zig PTY library for the real target
        working-directory: packages/pty-pool
        run: |
          zig build test
          zig build lib -Dtarget=aarch64-macos

      - name: Verify the Rust persistence crate compiles
        working-directory: packages/persistence
        run: cargo check --release

      - name: Build the Go shared libraries
        env:
          CGO_ENABLED: "1"
        working-directory: packages
        run: |
          cd orchestrator/cshared && go mod tidy && go build -buildmode=c-shared -o ../libhelios-orchestrator.dylib .
          cd ../../device-manager/cshared && go mod tidy && go build -buildmode=c-shared -o ../libhelios-device.dylib .

      - name: Assert the exported symbols the bridge expects actually exist
        run: |
          set -euo pipefail
          nm -gU packages/orchestrator/libhelios-orchestrator.dylib | grep -q _HeliosOrchestratorNew
          nm -gU packages/orchestrator/libhelios-orchestrator.dylib | grep -q _HeliosOrchestratorRecordTokens
          nm -gU packages/device-manager/libhelios-device.dylib | grep -q _HeliosDevicesNew
          nm -gU packages/device-manager/libhelios-device.dylib | grep -q _HeliosDevicesExec
          nm -gU packages/pty-pool/zig-out/lib/libhelios-pty.dylib | grep -q _pty_pool_spawn
          nm -gU packages/pty-pool/zig-out/lib/libhelios-pty.dylib | grep -q _pty_pool_abi_version
          echo "all expected symbols exported"

      # Full round trip: load the real libraries through the bridge and drive them.
      - uses: oven-sh/setup-bun@v2

      - name: Drive the real native libraries through the FFI bridge
        run: bun test packages/runtime-core/tests/unit/ffi_bridge.test.ts
